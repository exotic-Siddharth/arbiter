# Arbiter web tier (DESIGN.md section 17). Copied to /etc/nginx/conf.d/default.conf in the
# nginxinc/nginx-unprivileged image (deploy/web.Dockerfile), which includes it inside `http {}`.
#
#   /                 the built SPA, with the history fallback to /index.html
#   /api/, /socket.io/  proxied to the api container (Socket.IO with the WebSocket upgrade)
#   /healthz, /readyz proxied to the api (liveness and Postgres+Redis readiness)
#   /robots.txt, /sitemap.xml  proxied to the api (built from the public origin and the database)
#   /metrics          NOT exposed (scrape the api container directly if you run Prometheus)
#
# TLS is terminated in FRONT of this container (the optional Caddy service, or any proxy on the
# host); this server listens on plain HTTP 8080. See docs/DEPLOYMENT.md.

# Docker's embedded DNS. The api address is resolved per request (see $api below) instead of once at
# start-up, so nginx boots without the api and follows it when its container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

# Client address. Only a peer on a private (Docker or loopback-forwarded) range, i.e. the TLS proxy in
# front of us, may tell us the real client through X-Forwarded-For; a direct public client cannot spoof it.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The strict Content-Security-Policy applies to the SPA only. Responses that come from the api carry
# the api's own helmet policy (looser on /api/docs for Swagger UI), so they get none from here.
#   script-src 'self'        no inline scripts (the theme bootstrap is /theme-init.js)
#   style-src ... 'unsafe-inline'   Monaco, sonner and KaTeX set inline style attributes
#   worker-src 'self' blob:  Monaco's editor workers
#   connect-src 'self'       fetch and the same-origin Socket.IO WebSocket
map $uri $spa_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    ~^/(api|socket\.io|healthz|readyz|robots\.txt|sitemap\.xml)(/|$) "";
}

# The image's mime.types has no entry for .ttf or .otf, so they would be served as
# application/octet-stream, which gzip_types cannot match (the Monaco codicon font is a 150 KB .ttf).
# A `types` block at this level adds to the included mime.types instead of replacing it.
types {
    font/ttf ttf;
    font/otf otf;
}

# The page asked for, for the canonical link and og:url in index.html (which serves every route, so
# a fixed "/" there would tell Google that every page is the landing page). Only a plain path of
# URL-safe characters is used, without the query; anything else, e.g. a percent-encoded quote,
# falls back to "/", so the substitution can never break out of the attribute.
map $request_uri $page_path {
    default "/";
    "~^(?<path>/[A-Za-z0-9._~/-]*)(\?.*)?$" $path;
}

# Connection header for proxied requests: "upgrade" only on a WebSocket handshake.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # JSON bodies are 1 MB at most; the bulk test upload route accepts 20 MB (DESIGN.md section 12).
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/wasm image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # Security headers. `always` adds them to error responses too. No location below uses add_header
    # (nginx drops inherited headers in a location that defines its own): caching uses `expires`.
    add_header Content-Security-Policy $spa_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Only meaningful once the page is served over HTTPS by the proxy in front; browsers ignore it on HTTP.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ---- api ----
    set $api http://api:4000;

    # Proxy settings live at server level so every proxied location inherits them (nginx drops
    # inherited proxy_set_header lines in a location that sets its own).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the api (TRUST_PROXY=1) must see exactly the address worked out above.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # The headers above are added by this server for every response; drop the api's copies (helmet)
    # so each one appears once.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Strict-Transport-Security;

    location ~ ^/api/admin/problems/[^/]+/tests(/|$) {
        client_max_body_size 21m;
        proxy_pass $api;
    }

    location /api/ {
        proxy_pass $api;
    }

    location /socket.io/ {
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass $api;
    }

    location = /healthz {
        proxy_pass $api;
    }

    location = /readyz {
        proxy_pass $api;
    }

    # Cached for an hour by the api's Cache-Control header.
    location = /robots.txt {
        proxy_pass $api;
    }

    location = /sitemap.xml {
        proxy_pass $api;
    }

    location = /metrics {
        return 404;
    }

    # ---- SPA ----
    # Vite emits content-hashed file names under /assets/: cache for a year; a missing one is a real 404.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Unhashed public files.
    location ~ ^/(favicon\.svg|theme-init\.js|og-image\.png)$ {
        expires 1h;
    }

    # History fallback: every other path is a client-side route. index.html itself is never cached, so a
    # deploy takes effect on the next navigation. index.html ends its canonical link and og:url with
    # /__ARBITER_PATH__ (apps/web/index.html), replaced here by the page asked for.
    location / {
        expires -1;
        sub_filter '/__ARBITER_PATH__' $page_path;
        sub_filter_once off;
        try_files $uri /index.html;
    }
}
