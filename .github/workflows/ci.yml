# Continuous integration (DESIGN.md section 15). Four independent jobs:
#   checks       lint, formatting, typecheck, build, and the unit tests that need no services
#   integration  the API tests against real Postgres and Redis service containers
#   sandbox      builds the sandbox image, then runs the real-Docker sandbox and judge tests
#   e2e          Playwright (chromium) against api + worker + web; the report is uploaded on failure
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The default test and e2e URLs (apps/api/test/env.ts, apps/web/playwright.config.ts) use these
  # host ports and the arbiter/arbiter credentials, so the jobs below publish the services there.
  # Tests create their own databases (arbiter_test, arbiter_e2e) inside this server.
  CI: 'true'
  PRISMA_HIDE_UPDATE_MESSAGE: '1'

jobs:
  checks:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      # The web and shared packages have no service dependencies.
      - run: npm test -w @arbiter/shared -w @arbiter/web

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # The seed tests need the generated hidden tests (not committed; deterministic).
      - run: npm run problems:gen
      - run: npm test -w @arbiter/api

  sandbox:
    name: Sandbox image and real-Docker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the sandbox image
        run: docker build -t arbiter-sandbox:latest sandbox
      - name: Sandbox and judge-processor tests
        run: npm run test:sandbox

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # The e2e database is seeded with the demo problems, which need their generated hidden tests.
      - run: npm run problems:gen
      - name: Build the sandbox image (judging runs in real containers)
        run: docker build -t arbiter-sandbox:latest sandbox
      - name: Install chromium
        run: npx playwright install --with-deps chromium
      - name: Run the e2e suite
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore
